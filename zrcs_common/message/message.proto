syntax = "proto3";

package zrcs_message;

// 通用运动命令（保持向后兼容）
message MotionCommand {
    string command = 1;
    repeated double args = 2;
}

// ===== 细化的命令消息 =====

message MoveJCommand {
    repeated double joint_angles = 1;  // 各关节角度
    double velocity = 2;
    double acceleration = 3;
}

message MoveLCommand {
    double x = 1;
    double y = 2;
    double z = 3;
    double rx = 4;
    double ry = 5;
    double rz = 6;
    double velocity = 7;
    double acceleration = 8;
}

message MoveCCommand {
    // 中间点
    double mid_x = 1;
    double mid_y = 2;
    double mid_z = 3;
    // 终点
    double end_x = 4;
    double end_y = 5;
    double end_z = 6;
    double velocity = 7;
}

message JogCommand {
    int32 axis_id = 1;
    int32 direction = 2;  // 1 正方向, -1 反方向
    double speed = 3;
}

message IOCommand {
    int32 port = 1;
    bool value = 2;
}

// ===== 行为树命令 =====

message BehaviorTreeCommand {
    string action = 1;      // "LOAD", "START", "STOP", "STATUS"
    string xml_data = 2;    // action=LOAD 时携带行为树 XML 文本
}

message BehaviorTreeStatus {
    string tree_state = 1;   // "IDLE", "RUNNING", "SUCCESS", "FAILURE", "HALTED"
    string current_node = 2; // 当前执行节点名称
    string message = 3;      // 附加信息/错误信息
}

// 类型安全的命令封装
message TypedCommand {
    oneof payload {
        MoveJCommand move_j = 1;
        MoveLCommand move_l = 2;
        MoveCCommand move_c = 3;
        JogCommand jog = 4;
        IOCommand io = 5;
        MotionCommand generic = 10;  // 兼容旧版通用格式
        BehaviorTreeCommand bt_command = 11;
    }
}

// ===== 状态消息 =====

message AxisStatus {
    
    int32 axis_id = 1;
    double position = 2;
    double cmd_position = 3;
    double cmd_velocity = 4;
    double velocity = 5;
    double torque = 6;
    double planner_velocity = 7;
}

message RtLogStatus {
    uint64 timestamp_us = 1;
    uint32 level = 2;
    string file = 3;
    uint32 line = 4;
    string message = 5;
}

// 一个逻辑仿真步的完整轴反馈。simulation_time_ns 是 PlotJuggler 横轴，
// sequence 用于检测 PUB/SUB 链路中的丢帧或仿真进程重启。
message AxisFeedbackFrame {
    uint64 sequence = 1;
    uint64 simulation_time_ns = 2;
    repeated AxisStatus axes = 3;
}

message SystemStatus {
    repeated AxisStatus axes = 1;
    string system_state = 2;
    uint64 heartbeat = 3;
    uint64 dropped_commands = 4;
    repeated RtLogStatus rt_logs = 5;
    BehaviorTreeStatus bt_status = 6; // 行为树运行状态（树状态/当前节点/消息）
    // 高频发布时每条 SystemStatus 只携带一个逻辑步；保留 repeated 以兼容旧批量消息。
    repeated AxisFeedbackFrame axis_feedback_frames = 7;
    // PlotJuggler ProtobufParser 识别的源时间字段，单位为秒。
    double timestamp = 8;
}
